modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}_probe"
version="${mod_version}"
displayName="${mod_name} Probe"
authors="${mod_authors}"
description="${mod_description}"

[[dependencies.${mod_id}_probe]]
modId="${mod_id}"
type="required"
versionRange="[${mod_version}]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="neoforge"
type="required"
versionRange="[${loader_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}_probe]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[features.${mod_id}_probe]
javaVersion="[${java_version},)"

[[mixins]]
config="ravensmodels_probe.mixins.json"
